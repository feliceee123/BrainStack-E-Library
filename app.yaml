kind: wasmer.io/App.v0
owner: chrizkelly10
name: brainstack-e-library
package: .
env:
  DB_SSLMODE: "require"
capabilities:
  database:
    engine: postgres
locality:
  regions:
    - fr-roub1
health_checks:
  - http:
      method: get
      path: /api/health
      interval: 30s
      timeout: 10s
      unhealthy_threshold: 2
      healthy_threshold: 1
      expected_status_codes:
        - 200
